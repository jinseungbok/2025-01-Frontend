<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /*
        정방향 컨트롤 justify-content
        크로스방향 컨트롤 align-items

        기본 방향 row (왼쪽-오른쪽, 가로 방향)
        flex-direction: 방향 수정(row: 가로 방향, column: 세로 방향)
        */
      .container {
        background-color: gray;
        height: 400px;
        display: flex;
        /* 자식들을 컨트롤 할 때 쓰는 것이 flex */
        /* flex-direction: row; 기본값 */
        /* flex-direction: row-reverse; 우측에서 왼쪽 */
        flex-direction: row;
        /* justify-content: flex-start; 기본값(좌측 정렬)
           justify-content: center; 중앙 정렬(좌-우측 여백)
           justify-content: flex-end; 우측 정렬
           justify-content: space-between; 간격을 균일하게 띄움
           justify-content: space-around; 간격을 균일하게 띄움, 간격이 겹칠 시 2배 적용
           justify-content: space-evenly; 간격을 무조건 균일하게 조정
        */
        justify-content: flex-start;
        align-items: stretch;
        /*
           align-items: stretch; 기본값(쫙 늘림)
           align-items: flex-start; 필요한 만큼만 할당
           align-items: center; 좌측 중앙 정렬
           align-items: flex-end; 좌측 하단 정렬
        */
      }
      .container > div {
        background-color: maroon;
        color: #fff;
        padding: 10px;
        min-width: 48px;
        min-height: 48px;
        border: 1px solid #fff;
      }
    </style>
  </head>
  <body>
    <h1>flex-study.html</h1>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>
    <span>안녕하세요.</span>
  </body>
</html>
