<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>형제 선택자</title>
    <link rel="stylesheet" href="./sibling.css" />
  </head>
  <body>
    <h1>sibling.html</h1>
    <!-- div 태그와 동일한 기능, 시멘틱 요소 O -->
    <section>
      <p>p-0 아직 온라인 예약 신청이...</p>
      <h1>예약 방법 & 사용 요금</h1>
      <!-- <div>div 아직 온라인 예약 신청이...</div> -->
      <!-- div가 바로 위에 있으면 선택되지 않는다 -->
      <!-- p 태그가 2개 있어도 위에 있는 1개만 선택됨 -->
      <div>div 아직 온라인 예약 신청이...</div>
      <p>p-1 아직 온라인 예약 신청이...</p>
      <p>p-2 아직 온라인 예약 신청이...</p>
      <!-- h1 태그 위에 p 태그가 있을 수 없다 -->
      <div>
        <p>가족실(2~4인) : 60,000원</p>
        <p>도미토리(4인 공용) : 25,000원</p>
      </div>
    </section>
  </body>
</html>
