<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>체크 관련 인풋 타입</h1>
    <form action="#">
      <div>
        <label><input type="checkbox" name="typ" value="1" />유기농</label>
        <!-- <label><input type="checkbox" name="typ" value="1" checked />유기농</label> -->
        <!-- checked 시 체크된 상태로 가능 -->
        <!-- 둘 다 선택 가능 -->
      </div>
      <div>
        <label><input type="checkbox" name="typ" value="2" />무농약</label>
      </div>
      <div>
        <!-- radio 버튼은 단 하나만 선택할 수 있도록 함 -->
        <!-- radio 버튼만 설정할 경우 선택 해제가 불가능하므로 하나는 checked를 줘야 함 -->
        <label>
          <input type="radio" name="fruit" value="apple" checked />사과</label
        >

        <label><input type="radio" name="fruit" value="grape" />포도</label>
        <label><input type="radio" name="fruit" value="orange" />오렌지</label>
      </div>
      <div>
        <input type="submit" value="전송" />
      </div>
    </form>
  </body>
</html>
