<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>옵션을 사용하는 태그</h1>
    <h2>select, option tag</h2>
    <form action="#">
      <div><label for="lang">언어</label></div>
      <div>
        <select name="lang" id="lang" required>
          <option value="">-- 언어 선택 --</option>
          <option value="01">HTML</option>
          <option value="02">CSS</option>
        </select>
      </div>
      <div>
        <label for="shopping">쇼핑 목록</label>
      </div>
      <div>
        <div>
          <select id="shopping" name="shopping" multiple>
            <optgroup label="과일">
              과일
              <option value="apple">사과</option>
              <option value="grage">포도</option>
            </optgroup>
            <optgroup label="채소">
              <option value="carrot">당근</option>
              <option value="tomato">토마토</option>
            </optgroup>
          </select>
        </div>
        <div><label for="job">현재 직업</label></div>
        <div>
          <input type="text" id="job" list="jobs" />
          <!-- 여러 개 항목을 선택할 때 checkbox가 훨신 낫다 -->
          <datalist id="jobs">
            <option value="student"></option>
            <option value="designer"></option>
            <option value="publisher"></option>
            <option value="software engineer"></option>
          </datalist>
        </div>
        <input type="submit" value="전송" />
      </div>
    </form>
  </body>
</html>
