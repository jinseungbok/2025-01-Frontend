<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>텍스트 관련 인풋 타입</h1>
    <form action="#">
      <label
        >text: <input type="text" placeholder="힌트" maxlength="5"
      /></label>
      <br />
      <!-- placeholder : 뭔가 적어야 할 것을 알려주고 싶을 때. 작성하면 사라짐 -->
      <label>search: <input type="search" /></label> <br />
      <label>tell: <input type="tel" /></label> <br />
      <!-- tel : 모바일에서 포커스 활성화되면 숫자 키패드가 나타남 -->
    </form>
  </body>
</html>
